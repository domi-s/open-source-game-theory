name: distillation-tests
on:
  push:
    paths: ["llm-distillation/**"]
  pull_request:
    paths: ["llm-distillation/**"]
jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: llm-distillation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: llm-distillation/pyproject.toml
      - run: pip install -e ".[test]"
      - run: pytest
